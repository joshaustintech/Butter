<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe Detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{themeVars}};width:390px;height:844px;box-sizing:border-box;background:var(--bg);font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;position:relative">

  <div style="position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:56px 12px 0">
    <a href="{{listHref}}" style="display:flex;align-items:center;gap:4px;height:44px;padding:0 14px 0 10px;border-radius:22px;background:var(--card);font-size:16px;font-weight:500;color:var(--accent)">
      <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:var(--accent)"><path d="M9 2L3 9l6 7"/></svg>
      Recipes
    </a>
    <a href="{{editorHref}}" style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:22px;background:var(--accent);color:var(--onAccent);font-size:16px;font-weight:600">Edit</a>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding-bottom:40px">

    <!-- No photo: a monogram of the recipe name stands in its place -->
    <div style="height:240px;background:var(--hero0);position:relative;overflow:hidden">
      <svg width="390" height="240" viewBox="0 0 390 240" fill="none" aria-hidden="true" style="position:absolute;left:0;top:0">
        <g style="fill:var(--leaf)">
          <ellipse rx="11" ry="4.5" transform="translate(161.2 212.5) rotate(205)"/>
          <ellipse rx="11" ry="4.5" transform="translate(228.8 212.5) rotate(-205)"/>
          <ellipse rx="11" ry="4.5" transform="translate(139.4 197.5) rotate(224)"/>
          <ellipse rx="11" ry="4.5" transform="translate(250.6 197.5) rotate(-224)"/>
          <ellipse rx="11" ry="4.5" transform="translate(123.7 176.3) rotate(243)"/>
          <ellipse rx="11" ry="4.5" transform="translate(266.3 176.3) rotate(-243)"/>
          <ellipse rx="11" ry="4.5" transform="translate(115.8 151.1) rotate(262)"/>
          <ellipse rx="11" ry="4.5" transform="translate(274.2 151.1) rotate(-262)"/>
          <ellipse rx="11" ry="4.5" transform="translate(116.5 124.7) rotate(281)"/>
          <ellipse rx="11" ry="4.5" transform="translate(273.5 124.7) rotate(-281)"/>
          <ellipse rx="11" ry="4.5" transform="translate(125.7 100.0) rotate(300)"/>
          <ellipse rx="11" ry="4.5" transform="translate(264.3 100.0) rotate(-300)"/>
          <ellipse rx="11" ry="4.5" transform="translate(142.5 79.6) rotate(319)"/>
          <ellipse rx="11" ry="4.5" transform="translate(247.5 79.6) rotate(-319)"/>
          <ellipse rx="11" ry="4.5" transform="translate(165.0 65.8) rotate(338)"/>
          <ellipse rx="11" ry="4.5" transform="translate(225.0 65.8) rotate(-338)"/>
        </g>
      </svg>
      <div role="img" aria-label="Monogram {{mono}}" style="position:absolute;left:133px;top:78px;width:124px;height:124px;box-sizing:border-box;border-radius:62px;background:var(--hero1);border:2px solid var(--accent);box-shadow:inset 0 0 0 6px var(--hero1),inset 0 0 0 7px var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:72px;line-height:1;color:var(--ink)">{{mono}}</div>
    </div>

    <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:20px">

      <div style="display:flex;flex-direction:column;gap:8px">
        <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:38px;line-height:1.02;letter-spacing:-0.01em">{{title}}</h1>
        <div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)">
          <sc-if value="{{hasRating}}" hint-placeholder-val="{{ true }}">
            <span style="display:flex;gap:2px" role="img" aria-label="{{ratingAria}}">
              <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
                <span style="position:relative;width:16px;height:16px;display:block">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="position:absolute;left:0;top:0;stroke:var(--star)"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
                  <span style="position:absolute;left:0;top:0;bottom:0;overflow:hidden;width:{{s.w}}">
                    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="display:block;fill:var(--star)"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
                  </span>
                </span>
              </sc-for>
            </span>
            <span>{{ratingText}}</span>
          </sc-if>
          <span>{{added}}</span>
        </div>
      </div>

      <sc-if value="{{hasStats}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:8px">
          <sc-for list="{{stats}}" as="t" hint-placeholder-count="3">
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;background:{{t.tint}}">
              <span style="font-size:12px;font-weight:500;color:var(--muted)">{{t.label}}</span>
              <span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:22px;line-height:1.1">{{t.value}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{hasIngredients}}" hint-placeholder-val="{{ true }}">
        <section style="display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:28px">Ingredients</h2>
          <ul style="margin:0;padding:4px 16px;list-style:none;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column">
            <sc-for list="{{ingredients}}" as="i" hint-placeholder-count="7">
              <li style="display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;border-top:{{i.border}}">
                <span style="width:7px;height:7px;border-radius:4px;background:var(--leaf);flex:none"></span>
                <span>{{i.text}}</span>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-if>

      <sc-if value="{{hasSteps}}" hint-placeholder-val="{{ true }}">
        <section style="display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:28px">Method</h2>
          <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
              <li style="display:flex;gap:14px;align-items:flex-start">
                <span style="width:32px;height:32px;flex:none;border-radius:16px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:19px">{{s.n}}</span>
                <p style="margin:0;font-size:16px;line-height:1.5;padding-top:3px">{{s.text}}</p>
              </li>
            </sc-for>
          </ol>
        </section>
      </sc-if>

      <sc-if value="{{hasReview}}" hint-placeholder-val="{{ true }}">
        <section style="display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:28px">My Review</h2>
          <div style="padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)">
            <p style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:21px;line-height:1.3">{{review}}</p>
          </div>
        </section>
      </sc-if>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appearance":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"sample":{"editor":"enum","options":["galette","sandwich"],"default":"galette","section":"Sample recipe"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.appearance === 'dark';
    const T = dark ? {
      bg: '#1F1A15', card: '#2A231C', fill: '#352C23', line: '#433829', ink: '#F1E8D6', muted: '#BBAC95',
      accent: '#A9C08F', onAccent: '#1F1A15', star: '#E0B352', leaf: '#6F8A5A',
      tintSage: '#3B4630', tintButter: '#4D4222', tintRose: '#4F3030',
      hero0: '#33241F', hero1: '#3E2B27', hero2: '#5C3B38'
    } : {
      bg: '#F5EEDF', card: '#FBF7EC', fill: '#E9DFCB', line: '#E2D6BD', ink: '#3B2E25', muted: '#6B5A4C',
      accent: '#4F6340', onAccent: '#FBF7EC', star: '#B8862B', leaf: '#8FA37A',
      tintSage: '#D5DFC4', tintButter: '#F0DDA0', tintRose: '#EBC9C4',
      hero0: '#EBC9C4', hero1: '#F4DDD8', hero2: '#E5B4AD'
    };
    const themeVars = Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';color-scheme:' + (dark ? 'dark' : 'light');
    const sfx = dark ? 'Dark' : '';

    // Every field except the title is optional (null = not provided).
    const samples = {
      galette: {
        title: 'Rhubarb Galette', rating: 5, added: 'Added Nov 18',
        prep: '30 min', bake: '50 min', serves: '6',
        ingredients: ['1¼ cups all-purpose flour', '½ cup cold butter, cubed', '3 tbsp ice water', '1 lb rhubarb, sliced', '⅓ cup sugar', '1 tbsp cornstarch', '1 egg, beaten'],
        steps: [
          'Rub the butter into the flour until crumbly, then add ice water and bring together. Chill for 30 minutes.',
          'Toss the rhubarb with sugar and cornstarch.',
          'Roll the dough into a rough round, pile the filling in the centre and fold the edges over.',
          'Brush with egg and bake at 400°F until golden, about 50 minutes.'
        ],
        review: 'Tart and sweet in just the right measure. Next time, a little orange zest in the crust.'
      },
      sandwich: {
        title: 'Roast Turkey & Apple Sandwich', rating: 4.5, added: 'Added Nov 21',
        prep: '10 min', bake: null, serves: '2',
        ingredients: ['4 slices sourdough', '6 oz roast turkey', '½ crisp apple, thinly sliced', '2 tbsp whole-grain mustard', 'Handful of arugula'],
        steps: [
          'Spread mustard on all four slices.',
          'Layer turkey, apple and arugula, then close and halve.'
        ],
        review: null
      }
    };
    const s = samples[this.props.sample] || samples.galette;
    const r = s.rating;
    const stats = [
      s.prep && { label: 'Prep', value: s.prep, tint: 'var(--tintSage)' },
      s.bake && { label: 'Bake', value: s.bake, tint: 'var(--tintButter)' },
      s.serves && { label: 'Serves', value: s.serves, tint: 'var(--tintRose)' }
    ].filter(Boolean);
    return {
      themeVars,
      listHref: 'Main' + (dark ? 'Dark' : '') + '.dc.html',
      editorHref: 'RecipeEditor' + sfx + '.dc.html',
      title: s.title,
      mono: s.title.split(/\s+/).filter((w) => /^[A-Za-z]/.test(w)).slice(0, 1).map((w) => w[0].toUpperCase()).join(''),
      added: (r != null ? '· ' : '') + s.added,
      hasRating: r != null,
      ratingText: (r != null ? r.toFixed(1) : ''),
      ratingAria: r + ' out of 5 stars',
      stars: [1, 2, 3, 4, 5].map((n) => ({ w: r >= n ? '100%' : (r >= n - 0.5 ? '50%' : '0%') })),
      hasStats: stats.length > 0,
      stats,
      hasIngredients: !!(s.ingredients && s.ingredients.length),
      ingredients: (s.ingredients || []).map((text, i) => ({ text, border: i === 0 ? 'none' : '1px solid var(--line)' })),
      hasSteps: !!(s.steps && s.steps.length),
      steps: (s.steps || []).map((text, i) => ({ text, n: i + 1 })),
      hasReview: !!s.review,
      review: s.review || ''
    };
  }
}
</script>
</body>
</html>
